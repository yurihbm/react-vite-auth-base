name: Test

on:
  push:
    branches: [main]
  # Every PR runs, stacked ones included: GitHub can merge a stack partially,
  # so each PR must be green against its own base.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - name: Filter changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Required checks must still report, so jobs are skipped (counts as
          # passing) instead of filtering the workflow with `paths`.
          files=
          if [ "$EVENT" = pull_request ]; then
            if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename'); then
              files=
              echo "::warning::Could not list changed files; running all checks"
            fi
          fi
          check() {
            if [ -z "$files" ] || grep -Eq "$2" <<< "$files"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check app '^(src/|public/|scripts/|\.storybook/|index\.html$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|tsconfig[^/]*\.json$|vite\.config\.ts$|vitest\.shims\.d\.ts$|i18next\.config\.ts$|\.github/workflows/test\.yml$)'
          check i18n '^(src/|public/locales/|i18next\.config\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|\.github/workflows/test\.yml$)'

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run tests
        shell: bash
        run: |
          pnpm test:coverage --coverage.reporter=text --coverage.reporter=text-summary --coverage.reporter=json-summary | tee coverage_summary.txt

      - name: Compare coverage with the base branch
        id: coverage-report
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `autoUpdate` rewrites vite.config.ts in the workspace during the
          # test run, so read the committed version from git.
          git show HEAD:vite.config.ts > pr.vite.config.ts
          base_args=()
          if [ "$EVENT" = pull_request ]; then
            git fetch --depth=1 origin "$BASE_REF"
            git show FETCH_HEAD:vite.config.ts > base.vite.config.ts
            base_args=(--base-config base.vite.config.ts)
          fi
          sed -n '/Coverage summary/,$p' coverage_summary.txt > coverage_text.txt
          node scripts/coverage-report/main.ts "${base_args[@]}" \
            --config pr.vite.config.ts \
            --summary coverage/coverage-summary.json \
            --text coverage_text.txt --out comment.md

      - name: Post or update comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-report
          path: comment.md

  i18n-drift:
    needs: changes
    if: needs.changes.outputs.i18n == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n files and generated types are up to date
        run: |
          pnpm i18n
          test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
